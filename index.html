<script id="difficulty">
// Difficulty levels — pure layer. No DOM, no globals from the main script.
const DIFF_IDS=['easy','normal','hard'];
const DIFFS={
 easy:{label:'Easy',power:.85,ai:[.01,.0075,.02],retreat:.15,gems:[10,10],points:[80,40],leg:false,
  hint:'Enemies ×0.85, lazier AI, gentle rewards. No legendary Pokémon.'},
 normal:{label:'Normal',power:1,ai:[.02,.015,.05],retreat:.3,gems:[20,15],points:[100,50],leg:false,
  hint:'The standard game.'},
 hard:{label:'Hard',power:1.2,ai:[.05,.04,.12],retreat:.4,gems:[30,25],points:[140,90],leg:true,
  hint:'Enemies ×1.2, sharper AI, a legendary on their team — and the best rewards.'}
};
const diffOf=s=>s&&DIFF_IDS.includes(s.diff)?s.diff:'normal';
const enemyPower=d=>DIFFS[d].power,aiRates=d=>DIFFS[d].ai,retreatAt=d=>DIFFS[d].retreat;
const matchGems=(d,win)=>DIFFS[d].gems[win?0:1],matchPoints=(d,win)=>DIFFS[d].points[win?0:1];
const legendaryAllowed=d=>DIFFS[d].leg;

<script id="save-io">
// Save export/import — pure layer. No DOM, no globals from the main script.
const SAVE_GAME='pokebattles',SAVE_VERSION=1,SAVE_CODE_PREFIX='PDB1-';
function b64urlEncode(str){return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64urlDecode(str){let b=String(str).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return decodeURIComponent(escape(atob(b)))}
const isObj=v=>!!v&&typeof v=='object'&&!Array.isArray(v);
const isNum=v=>typeof v=='number'&&isFinite(v)&&v>=0;
function summarize(state,saved){return{gems:state.gems,caught:Object.keys(state.caught).length,wins:state.wins,saved:saved}}
function buildExportPayload(S){
 const state={...S};delete state.bst;
 const saved=new Date().toISOString();
 const env={game:SAVE_GAME,v:SAVE_VERSION,saved,state};
 return{code:SAVE_CODE_PREFIX+b64urlEncode(JSON.stringify(env)),fileJson:JSON.stringify(env,null,2),fileBase:'pokebattles-save-'+saved.slice(0,10),summary:summarize({gems:S.gems||0,caught:S.caught||{},wins:S.wins||0},saved)};
}
function validateSaveState(st){
 if(!isObj(st)||!isObj(st.caught)||!isObj(st.ach))return null;
 if(!isNum(st.gems)||!isNum(st.wins))return null;
 if(Object.values(st.caught).some(c=>!isObj(c)))return null;
 for(const k of['mgs','skin','bst','mis','items'])if(st[k]!==undefined&&!isObj(st[k]))return null;
 if(st.boost!==undefined&&!isNum(st.boost))return null;
 if(st.diff!==undefined&&!DIFF_IDS.includes(st.diff))return null;
 const o={...st};
 for(const k of['se','crit','lead']){if(o[k]===undefined)o[k]=0;else if(!isNum(o[k]))return null}
 return o;
}
function parseImportPayload(text){
 text=String(text==null?'':text).trim();
 if(!text)return{ok:false,error:'empty'};
 let env;
 if(text.startsWith(SAVE_CODE_PREFIX)){
  try{env=JSON.parse(b64urlDecode(text.slice(SAVE_CODE_PREFIX.length).replace(/\s+/g,'')))}catch(e){return{ok:false,error:'cutoff'}}
  if(!isObj(env))return{ok:false,error:'cutoff'};
 }else{
  try{env=JSON.parse(text)}catch(e){return{ok:false,error:'format'}}
  if(!isObj(env))return{ok:false,error:'format'};
 }
 if(env.game!==SAVE_GAME)return{ok:false,error:'format'};
 if(env.v!==SAVE_VERSION)return{ok:false,error:'version'};
 const state=validateSaveState(env.state);
 if(!state)return{ok:false,error:'shape'};
 return{ok:true,state,summary:summarize(state,typeof env.saved=='string'?env.saved:null)};
}
// Mirrors the normal load path (S.skin/gems/bst/mgs defaults) so an imported save behaves exactly like one found in localStorage; bst is stripped from exports and refilled by scan().
function applyImportState(imported){
 const s=JSON.parse(JSON.stringify(imported));
 s.skin=s.skin||{};s.gems=s.gems??0;s.bst=s.bst||{};s.mgs=s.mgs||{};s.pts=s.pts||0;
 s.diff=DIFF_IDS.includes(s.diff)?s.diff:'normal';
 return s;
}
</script>
<script id="missions">
// Missions + reward path — pure layer (no DOM, no globals from the main script).
const MIS_REWARD=20,MIS_PER_LEVEL=5,MIS_MAXLV=50,MIS_SLOTS=3,MIS_PRIZE_SKIN='home';
const MT={
 play2:{t:'Play 2 matches',s:'play',n:2},play4:{t:'Play 4 matches',s:'play',n:4},
 win1:{t:'Win a match',s:'win',n:1},win3:{t:'Win 3 matches',s:'win',n:3},
 kill5:{t:'Defeat 5 opposing Pokémon',s:'kills',n:5},kill12:{t:'Defeat 12 opposing Pokémon',s:'kills',n:12},
 wild10:{t:'Defeat 10 wild Pokémon',s:'wild',n:10},wild25:{t:'Defeat 25 wild Pokémon',s:'wild',n:25},
 pts30:{t:'Score 30 points',s:'pts',n:30},pts80:{t:'Score 80 points',s:'pts',n:80},
 buy1:{t:'Buy a Pokémon or a skin in the Shop',s:'buy',n:1}};
// Gems for reaching a path level: every level 5, every 5th level 10, every 25th 25 (the highest applicable one, not stacked); level 50 is the special prize (50 gems + a 3D skin).
const misLevel=done=>Math.min(MIS_MAXLV,Math.floor(done/MIS_PER_LEVEL));
const misLevelGems=l=>l>=MIS_MAXLV?50:l%25==0?25:l%5==0?10:5;
function misPick(excl,rnd){
 const ids=Object.keys(MT),bad=new Set(excl.map(id=>MT[id]&&MT[id].s));
 let c=ids.filter(id=>!excl.includes(id)&&!bad.has(MT[id].s));
 if(!c.length)c=ids.filter(id=>!excl.includes(id));
 if(!c.length)c=ids;
 return{id:c[Math.floor(rnd()*c.length)%c.length],p:0};
}
function misNormalize(m,rnd){
 rnd=rnd||Math.random;
 if(!m||typeof m!='object'||Array.isArray(m))m={};
 m.done=Number.isFinite(m.done)&&m.done>0?Math.floor(m.done):0;
 m.prize=m.prize===1||m.prize===2?m.prize:0;
 m.next=Number.isFinite(m.next)&&m.next>0?m.next:0;
 m.last=Number.isFinite(m.last)&&m.last>0?Math.min(MIS_MAXLV,Math.floor(m.last)):0;
 const seen=new Set();
 m.act=(Array.isArray(m.act)?m.act:[]).filter(a=>a&&typeof a=='object'&&MT[a.id]&&!seen.has(a.id)&&seen.add(a.id)).slice(0,MIS_SLOTS)
  .map(a=>({id:a.id,p:Math.max(0,Math.min(MT[a.id].n,Math.floor(+a.p)||0))}));
 while(m.act.length<MIS_SLOTS)m.act.push(misPick(m.act.map(a=>a.id),rnd));
 return m;
}
// ev example: {play:1,win:1,kills:3,pts:42,wild:9,buy:1}. Returns the ids of missions that just became complete.
function misEvent(m,ev){
 const done=[];
 m.act.forEach(a=>{const t=MT[a.id],add=Math.floor(+ev[t.s])||0;
  if(add>0&&a.p<t.n){a.p=Math.min(t.n,a.p+add);if(a.p>=t.n)done.push(a.id)}});
 return done;
}
const MIS_PERIOD=5*24*3600*1000;
// The reward path restarts every 5 days: levels go back to the start. The missions on the board are untouched, and a level-50 prize that hasn't been picked yet is kept.
function misReset(m,now){
 if(!Number.isFinite(now))return false;
 if(!(m.next>0)||m.next-now>MIS_PERIOD){m.next=now+MIS_PERIOD;return false}
 if(now<m.next)return false;
 m.next+=Math.ceil((now-m.next+1)/MIS_PERIOD)*MIS_PERIOD;
 m.last=misLevel(m.done);m.done=0;if(m.prize===2)m.prize=0;
 return true;
}
function misTimeLeft(ms){
 if(!(ms>0))return 'moments';
 const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),mi=Math.floor(ms%36e5/6e4);
 return d>0?d+'d '+h+'h':h>0?h+'h '+mi+'m':Math.max(1,mi)+'m';
}
const misReady=m=>m.act.filter(a=>a.p>=MT[a.id].n).length+(m.prize===1?1:0);
// Claims a finished mission. Returns null if it isn't finished, else {gems,mission,level,levelGems,prize}; the caller adds `gems` to the player's balance.
function misClaim(m,i,rnd){
 rnd=rnd||Math.random;
 const a=m.act[i],t=a&&MT[a.id];
 if(!t||a.p<t.n)return null;
 m.done++;
 let gems=MIS_REWARD,level=null,levelGems=0,prize=false;
 if(m.done%MIS_PER_LEVEL==0&&m.done/MIS_PER_LEVEL<=MIS_MAXLV){
  level=m.done/MIS_PER_LEVEL;levelGems=misLevelGems(level);gems+=levelGems;
  if(level==MIS_MAXLV&&m.prize===0){m.prize=1;prize=true}}
 m.act[i]=misPick(m.act.filter((_,j)=>j!=i).map(x=>x.id).concat(a.id),rnd);
 return{gems,mission:MIS_REWARD,level,levelGems,prize};
}
// Level-50 prize: the chosen Pokémon gets the 3D skin. Returns true on success.
function misClaimPrize(S,id){
 const m=S&&S.mis,c=S&&S.caught&&S.caught[id];
 if(!m||m.prize!==1||!c)return false;
 const sk=Array.isArray(c.sk)?c.sk:[];
 if(sk.includes(MIS_PRIZE_SKIN))return false;
 c.sk=[...sk,MIS_PRIZE_SKIN];m.prize=2;
 return true;
}
</script>
<script id="items">
// Items — pure layer. S.items = {itemKey: count owned}; S.boost = battles of x2 battle points left.
const ITEMS={boost:{n:'Points Booster',d:'Doubles the battle points you earn for 105 battles.',battles:105,ico:'⚡'}};
const itemCount=(S,k)=>Math.max(0,Math.floor(+(S.items&&S.items[k]))||0);
const boostLeft=S=>Math.max(0,Math.floor(+S.boost)||0);
// Earned by playing: each win has a BOOST_DROP chance to drop a Points Booster into S.items (rnd defaults to Math.random).
const BOOST_DROP=.25;
function boostDrop(S,rnd){if(!((rnd||Math.random)()<BOOST_DROP))return false;
 S.items=S.items&&typeof S.items=='object'&&!Array.isArray(S.items)?S.items:{};S.items.boost=itemCount(S,'boost')+1;return true}
// Using a booster while one is running adds its battles on top, so nothing is wasted.
function itemUse(S,k){const it=ITEMS[k];if(!it||itemCount(S,k)<1)return false;
 S.items[k]=itemCount(S,k)-1;if(k=='boost')S.boost=boostLeft(S)+it.battles;return true}
// Call once per finished battle with the points earned. Returns the points to award (x2 while boosted) and uses up one boosted battle.
function boostBattle(S,bp){const on=boostLeft(S)>0;if(on)S.boost=boostLeft(S)-1;return{bp:on?bp*2:bp,boosted:on,left:boostLeft(S)}}
// Potion: every match you carry one. Press I to heal 25% of your max health, then it recharges for 15 seconds. f.pot = seconds of cooldown left.
const POTION={n:'Potion',heal:.25,cd:15,ico:'🧪',d:'You get one in every match. Press I to heal 25% of your health. Then it recharges for 15 seconds.'};
function potionUse(f){if(!f||f.dead||!(f.max>0)||(f.pot||0)>0||f.hp>=f.max)return 0;
 const h=Math.min(f.max-f.hp,f.max*POTION.heal);f.hp+=h;f.pot=POTION.cd;return h}
const potionTick=(f,dt)=>{if(f.pot>0)f.pot=Math.max(0,f.pot-dt)};
</script>
<script id="confetti">
// Confetti — pure layer (no DOM). Pieces start above the screen, fall with gravity, sway and spin.
const CONFETTI_COLORS=['#fbbf24','#ef4444','#3b82f6','#22c55e','#a855f7','#ec4899','#f97316'];
function confettiPieces(n,w,h,rnd){rnd=rnd||Math.random;return Array.from({length:n},()=>({x:rnd()*w,y:-10-rnd()*h*.3,vx:(rnd()-.5)*120,vy:60+rnd()*140,w:6+rnd()*6,h:10+rnd()*8,rot:rnd()*6.283,vr:(rnd()-.5)*12,sw:2+rnd()*3,ph:rnd()*6.283,d:rnd()*1.8,c:CONFETTI_COLORS[Math.floor(rnd()*CONFETTI_COLORS.length)%CONFETTI_COLORS.length]}))}
function confettiStep(ps,dt,t){ps.forEach(p=>{if(t<p.d)return;p.vy=Math.min(380,p.vy+260*dt);p.ph+=p.sw*dt;p.x+=(p.vx+Math.sin(p.ph)*60)*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.vx*=1-.4*dt})}
const confettiDone=(ps,t,h)=>t>7||ps.every(p=>p.y>h+30);
</script>
<script id="hold-keys">
// Hold-to-trigger — pure layer. Hold every key in HK_KEYS for HK_SECS seconds (once per hold).
const HK_KEYS=atob('YXJp').split(''),HK_SECS=2;
function holdUpdate(st,held,dt){if(!held){st.t=0;st.fired=false;return false}st.t+=dt;if(!st.fired&&st.t>=HK_SECS){st.fired=true;return true}return false}
</script>

function inv(){const ids=Object.keys(S.caught).map(Number).sort((a,b)=>(S.caught[b].bp||0)-(S.caught[a].bp||0));

 ids.map(i=>{const c=S.caught[i],bp=c.bp||0,k=mySkin(i),got=MS.filter(m=>bp>=m[0]),nx=MS.find(m=>bp<m[0]),lo=got.length?got[got.length-1][0]:0;

const kn=e=>{const a=[(e.key||'').toLowerCase()];if(e.code&&e.code.startsWith('Key'))a.push(e.code.slice(3).toLowerCase());if(e.code=='Space')a.push(' ');return a};
const hkDown={},hkSt={t:0,fired:false};let hkIv=0,hkLast=0;
const hkAll=()=>HK_KEYS.every(k=>hkDown[k]);
function hkCheck(){if(!hkAll()){holdUpdate(hkSt,false,0);return}if(hkIv)return;hkLast=performance.now();
 hkIv=setInterval(()=>{const n=performance.now(),dt=(n-hkLast)/1000;hkLast=n;const held=hkAll();if(holdUpdate(hkSt,held,dt))confetti();if(!held){clearInterval(hkIv);hkIv=0}},100)}
const hkClear=()=>{HK_KEYS.forEach(k=>delete hkDown[k]);hkCheck()};
addEventListener('keydown',e=>{const a=kn(e);a.forEach(k=>{if(HK_KEYS.includes(k))hkDown[k]=1;if(M&&!M.over)M.keys[k]=1});hkCheck();if(M&&!M.over&&a.some(k=>NOKEY.includes(k)))e.preventDefault()});

addEventListener('blur',()=>{hkClear();if(M)M.keys={}});document.addEventListener('visibilitychange',()=>{if(document.hidden)hkClear()});

musLabel();render();loadNames().then(()=>{if(tab=='dex')dex()});Object.entries(S.mgs).forEach(([i,m])=>NAMES[i]=m.n);loadMegas();scan();
